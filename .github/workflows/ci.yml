name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stakehabit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d stakehabit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stakehabit_test
      JWT_SECRET_KEY: ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app tests

      - name: Check formatting with Black
        run: black --check app tests

      - name: Run test suite
        run: |
          pytest tests/ -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run database migrations
        run: alembic upgrade head

  migration-drift-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stakehabit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d stakehabit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stakehabit_test
      JWT_SECRET_KEY: ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply migrations (drift base)
        run: alembic upgrade head

      - name: Migration drift check (autogenerate, self-contained)
        run: |
          set -euo pipefail
          # 1) Bring the schema up to head so the autogenerate diff below always
          #    compares against the migrated state (no cross-step ordering deps).
          alembic upgrade head
          # 2) Autogenerate a throwaway revision. The default DB dialect owns the
          #    schema; if the models and migrations are in sync, the generated
          #    revision is empty (no `op.*` operations) and there is no drift.
          alembic revision --autogenerate -m "ci_check" || true
          # 3) `ls -t` already yields the full `alembic/versions/<file>` path, so
          #    use it verbatim everywhere below (no re-prefixing).
          LATEST=$(ls -t alembic/versions/*.py 2>/dev/null | head -n1 || true)
          if [ -n "$LATEST" ]; then
            if grep -q "op\." "$LATEST"; then
              echo "Migration drift detected (autogenerate produced operations)"
              sed -n '1,200p' "$LATEST"
              rm -f "$LATEST"
              exit 1
            else
              echo "No migration drift (generated revision is empty)"
              rm -f "$LATEST"
            fi
          else
            echo "No revision generated by autogenerate (no drift)"
          fi

  security-scan:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pip-audit (fail on HIGH)
        run: |
          python -m pip install pip-audit --upgrade
          # Run pip-audit with JSON output. The `|| true` keeps the step running when a
          # vulnerability is found so we can evaluate the findings below.
          pip-audit -f json -o pip_audit.json || true
          python - <<'PY'
          import json
          import os
          import sys

          path = "pip_audit.json"
          if not os.path.exists(path):
              print("pip-audit did not produce JSON output")
              sys.exit(1)

          data = json.load(open(path))
          # Newer pip-audit versions emit a top-level object under "dependencies"
          # instead of a bare top-level list (see -f json).
          if isinstance(data, dict):
              dependencies = data.get("dependencies", [])
          else:
              dependencies = data

          found = False
          for pkg in dependencies:
              # Robust against older schema versions that wrap each dependency
              # as {"name": ..., "version": ..., "vulns": [...]}.
              if not isinstance(pkg, dict):
                  continue
              for v in pkg.get("vulns", []):
                  print("Vulnerable package:", pkg.get("name"), "->", v)
                  found = True

          if found:
              sys.exit(1)
          print("No pip-audit findings")
          PY

      - name: Run bandit and fail on medium+ issues
        run: |
          set -euo pipefail
          # Run bandit and write JSON output (don't fail on bandit exit code so we can parse results)
          bandit -r app -f json -o bandit.json || true
          # Fail if JSON contains MEDIUM/HIGH/CRITICAL issue_severity
          if grep -En '"issue_severity"\s*:\s*"(MEDIUM|HIGH|CRITICAL)"' bandit.json >/dev/null 2>&1; then
            echo "Bandit medium+ issues found:"
            # Print matching lines for inspection
            grep -En '"issue_severity"\s*:\s*"(MEDIUM|HIGH|CRITICAL)"' bandit.json || true
            # Also show nearby filename/issue_text lines for context
            grep -En '"filename"|"issue_text"' bandit.json || true || true
            exit 1
          else
            echo "No bandit medium+ issues"
          fi

  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy (non-blocking)
        run: mypy app || true

