name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stakehabit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d stakehabit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stakehabit_test
      JWT_SECRET_KEY: ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check app tests

      - name: Check formatting with Black
        run: black --check app tests

      - name: Run test suite
        run: |
          pytest tests/ -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Run database migrations
        run: alembic upgrade head

  migration-drift-check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stakehabit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d stakehabit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stakehabit_test
      JWT_SECRET_KEY: ci-test-secret-key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Apply migrations (drift base)
        run: alembic upgrade head

      - name: Migration drift check (autogenerate)
        run: |
          set -euo pipefail
          # Try to autogenerate a revision and fail if it contains operations
          alembic revision --autogenerate -m "ci_check" || true
          LATEST=$(ls -t alembic/versions 2>/dev/null | head -n1 || true)
          if [ -n "$LATEST" ]; then
            if grep -q "op\." "alembic/versions/$LATEST"; then
              echo "Migration drift detected: generated file has operations"
              sed -n '1,200p' "alembic/versions/$LATEST"
              rm "alembic/versions/$LATEST"
              exit 1
            else
              echo "No migration drift (generated revision empty)"
              rm "alembic/versions/$LATEST"
            fi
          else
            echo "No revision generated by autogenerate (no drift)"
          fi

  security-scan:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pip-audit (fail on HIGH)
        run: |
          python -m pip install pip-audit --upgrade
          pip-audit --fail-on HIGH

      - name: Run bandit and fail on medium+ issues
        run: |
          python - <<'PY'
from pathlib import Path
import json, sys, subprocess
subprocess.run(["bandit", "-r", "app", "-f", "json", "-o", "bandit.json"], check=False)
data = json.load(open('bandit.json')) if Path('bandit.json').exists() else {'results': []}
issues = [i for i in data.get('results', []) if i.get('issue_severity') in ('MEDIUM', 'HIGH', 'CRITICAL')]
if issues:
    print('Bandit medium+ issues found:')
    for i in issues:
        print(i.get('filename'), i.get('line_number'), i.get('issue_text'))
    sys.exit(1)
print('No bandit medium+ issues')
PY

  type-check:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run mypy (non-blocking)
        run: mypy app || true

