[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stakehabit-api"
version = "0.1.0"
description = "StakeHabit API using FastAPI, SQLAlchemy, PostgreSQL, and JWT authentication."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.24.0",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "bcrypt<5",
    "passlib[bcrypt]>=1.7",
    "PyJWT>=2.8",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "alembic>=1.12",
    "python-multipart>=0.0.6"
]
[project.optional-dependencies]
# Pinned to the exact green build. The gate-keeping linters (ruff's default rule
# set, pip-audit's JSON schema, bandit severity levels) evolve between releases,
# so floating versions (`>=`) made CI flaky whenever a new build shipped.
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.7",
    "black==26.5.1",
    "mypy==2.3.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "pytest-cov==7.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
target-version = ["py312"]
line-length = 120

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
